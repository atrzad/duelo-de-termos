name: duelo-de-termos-tailscale
# "Máquina" própria na rede Tailscale só pro Duelo de Termos: https://duelo-de-termos.<sua-tailnet>.ts.net
# Não mexe no tailscaled da máquina nem no Funnel de outros serviços (modo userspace, estado próprio).
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: duelo-de-termos-tailscale
    hostname: duelo-de-termos
    network_mode: host          # enxerga o jogo em 127.0.0.1:3500
    env_file: .env              # TS_AUTHKEY=... (só você edita; nunca vai para o git)
    environment:
      - TS_HOSTNAME=duelo-de-termos
      - TS_USERSPACE=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./estado:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    restart: unless-stopped
